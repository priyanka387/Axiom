[project]
name = "axiom-api"
version = "0.1.0"
description = "Axiom HTTP API"
requires-python = ">=3.11"
dependencies = [
  "axiom-core",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4,<26",
]

[tool.uv.sources]
axiom-core = { workspace = true }
